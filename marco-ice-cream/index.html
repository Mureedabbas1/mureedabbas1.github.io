.nav{display:flex;gap:9px;overflow:auto;padding:16px 0 8px;scrollbar-width:none}.nav button{border:1px solid #f0d9e0;background:#fffaf9e8;color:#694451;border-radius:13px;padding:11px 15px;white-space:nowrap;font-weight:700;box-shadow:0 4px 12px #74334a0a;transition:.2s}.nav button:hover{transform:translateY(-2px);border-color:#d88ba1}.nav button.active{background:linear-gradient(135deg,#a83e62,#d36e8b);color:white;border-color:transparent;box-shadow:0 7px 18px #a83e6238}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0}.stat,.panel{background:#fffdfcf0;border:1px solid #f0dce2;border-radius:20px;padding:18px;box-shadow:var(--shadow);backdrop-filter:blur(12px)}.stat{position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:72px;height:72px;right:-22px;top:-22px;border-radius:50%;background:linear-gradient(135deg,#ffdce6,#f8e8bd);opacity:.7}.stat small{color:var(--muted);font-weight:650}.stat strong{display:block;font-size:24px;margin-top:7px;letter-spacing:-.5px;color:#633044;overflow-wrap:anywhere}.stat .hint{font-size:12px;color:var(--muted)}.panel{margin:14px 0}.panel h2{font-size:18px;margin:0 0 13px;color:#663348}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:13px;padding:11px 16px;background:linear-gradient(135deg,#a83e62,#d36e8b);color:white;font-weight:750;box-shadow:0 6px 15px #a83e6226;transition:transform .18s,filter .18s}.btn:hover{transform:translateY(-1px);filter:brightness(1.04)}.btn.alt{background:#ffedf2;color:#963e5d;border:1px solid #f4cbd7;box-shadow:none}.btn.dark{background:#633348}.btn.red{background:#fff0ef;color:var(--red);box-shadow:none}.btn:disabled{opacity:.48;cursor:not-allowed;transform:none}
.stock-item:disabled{opacity:.45;cursor:not-allowed}.stock-item:not(:disabled):hover{border-color:#c15d7d;transform:translateY(-2px)}.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}.field label{font-size:12px;font-weight:750;color:#80616d}.field input,.field select,.field textarea,.search{border:1px solid #ead5dc;border-radius:12px;padding:11px 12px;background:#fff;color:var(--ink);min-width:0;width:100%;outline:none;transition:.2s}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:#c15d7d;box-shadow:0 0 0 3px #c15d7d19}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.tablewrap{overflow:auto;border-radius:13px}table{border-collapse:collapse;width:100%;min-width:600px;background:#fff}th,td{text-align:left;padding:12px 11px;border-bottom:1px solid #f2e4e8;font-size:13px;white-space:nowrap}th{color:#906d79;font-size:11px;text-transform:uppercase;letter-spacing:.05em;background:#fff4f6}tbody tr:hover td{background:#fff9fa}td strong{font-size:13px}.money{font-variant-numeric:tabular-nums;font-weight:750}.positive{color:#397b5a}.negative{color:var(--red)}.muted{color:var(--muted)}.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#e8f5e9;color:#397b5a;font-size:11px;font-weight:750}.tag.red{background:#fff0ef;color:#b83d4b}.dealer-row-receive td{background:#fff1f1!important}.dealer-row-clear td{background:#edf8f0!important}.dealer-row-pay td{background:#fff8e6!important}.tag.yellow{background:#fff0c9;color:#8a6412}.empty{padding:30px;text-align:center;color:var(--muted)}.hidden{display:none!important}
.login{max-width:440px;margin:7vh auto;background:#fffdfcf2;padding:28px;border:1px solid #f0dce2;border-radius:26px;box-shadow:0 24px 70px #74334a26;backdrop-filter:blur(14px)}.login h2{margin:26px 0 4px;color:#633348;font-size:26px}.login p{color:var(--muted);font-size:13px}.foot{text-align:center;color:#927784;font-size:11px;padding:20px}.notice{padding:12px 14px;border-radius:13px;background:#fff6e6;color:#77591d;font-size:13px;margin:12px 0;border:1px solid #f5e4bd}
.modal{position:fixed;inset:0;background:#32151fc2;display:grid;place-items:center;padding:16px;z-index:5;backdrop-filter:blur(5px)}.modalbox{background:#fffaf9;border:1px solid #f1dce2;border-radius:22px;padding:22px;width:min(580px,100%);max-height:90vh;overflow:auto;box-shadow:0 24px 70px #210b1644}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{color:#633348}.close{border:0;background:#ffedf2;color:#873c58;border-radius:11px;padding:8px 11px}.actions{display:flex;gap:8px;flex-wrap:wrap}.split{display:grid;grid-template-columns:1.3fr .7fr;gap:14px}.routebox{background:linear-gradient(120deg,#fff0f4,#f0f7e9);border:1px solid #efd7df;border-radius:17px;padding:16px}.routebox strong{display:block;font-size:17px;color:#773b52}.small{font-size:12px;color:var(--muted)}
@media(max-width:760px){.shell{padding:10px}.top{border-radius:18px;padding:14px}.top:after{right:4%;font-size:48px}.routepill{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{padding:13px}.stat strong{font-size:18px}.formgrid{grid-template-columns:1fr}.split{grid-template-columns:1fr}.panel{padding:14px}.nav button{padding:10px 12px}.brand h1{font-size:16px}.login{margin:5vh 12px;padding:22px}.logo{width:50px;height:50px;flex-basis:50px}}
@media(min-width:761px){.shell{padding:26px}}

<div id="login" class="login"><div class="brand"><div class="logo"><img src="../Marco%20Ice%20Careem%20Logo.png" alt="Marco Ice Cream logo"></div><div><h1>MARCO ICE CREAM</h1><small class="muted">Distribution Manager</small></div></div><h2 style="margin-top:24px">Welcome back</h2><p>Sign in to your account.</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn" style="width:100%;margin-top:8px">Login</button><div id="loginMsg" class="small" style="margin-top:12px"></div></form><div class="notice">Ask the administrator to create your account.</div></div>
<div id="app" class="hidden"><div class="shell"><header class="top"><div class="brand"><div class="logo"><img src="../Marco%20Ice%20Careem%20Logo.png" alt="Marco Ice Cream logo"></div><div><h1>MARCO ICE CREAM</h1><small>Distribution Manager · Frozen Dessert</small></div></div><div class="actions"><span class="routepill">Salesman: Anayat Ali</span><button id="logout" class="btn alt">Logout</button></div></header><nav class="nav" id="nav"><button data-tab="dashboard" class="active">Dashboard</button><button data-tab="dealers">Dealers</button><button data-tab="route">Current Route</button><button data-tab="stock">Factory / Stock</button><button data-tab="sales">Sales</button><button data-tab="expenses">Expenses</button><button data-tab="payments">Payments</button><button data-tab="reports">Reports</button></nav>
<main id="content"></main><div class="foot">Marco Ice Cream Distribution · Data is securely stored online.</div></div></div>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">Add record</h2><button class="close" id="modalClose" aria-label="Close" title="Close">✕</button></div><div id="modalBody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://ncmgcgvfjnogjdqxvwjr.supabase.co";
const SUPABASE_KEY="sb_publishable__VaKYX3KTlVp909WnYErcg_mN_BVqtD";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s), fmt=n=>"PKR "+Number(n||0).toLocaleString("en-PK",{maximumFractionDigits:0}), dateNow=()=>new Date().toISOString().slice(0,10);
let currentUser=null,tab="dashboard",route=null,dealers=[],balances=[],loads=[],sales=[],expenses=[],payments=[],summary=[],products=[];
function msg(t){$('#loginMsg').textContent=t}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();msg("Logging in…");const {error}=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(error)msg(error.message);else boot()});
$('#logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('#modalClose').onclick=()=>$('#modal').classList.add('hidden');
function openModal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').classList.remove('hidden')}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){$('#login').classList.remove('hidden');$('#app').classList.add('hidden');return}currentUser=session.user;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await refresh();render()}
async function refresh(){
 const q=async(t)=>{const {data,error}=await sb.from(t).select(t==='sales'?'*, sale_items(*)':'*');if(error)throw error;return data||[]};
 try{[dealers,loads,sales,expenses,payments,summary,products]=await Promise.all([q('dealers'),q('route_loads'),q('sales'),q('route_expenses'),q('dealer_payments'),q('route_profit_summary'),q('products')]);
 const {data:rs,error}=await sb.from('routes').select('*').eq('status','open').order('created_at',{ascending:false}).limit(1);if(error)throw error;route=rs?.[0]||null;
 const {data:bs,error:be}=await sb.from('dealer_balances').select('*').order('name');if(be)throw be;balances=bs||[];
 }catch(e){alert("Data load error: "+e.message)}
}
function nav(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
function render(){nav();const c=$('#content');if(tab==='dashboard')c.innerHTML=dashboard();if(tab==='dealers')c.innerHTML=dealerPage();if(tab==='route')c.innerHTML=routePage();if(tab==='stock')c.innerHTML=stockPage();if(tab==='sales')c.innerHTML=salesPage();if(tab==='expenses')c.innerHTML=expensesPage();if(tab==='payments')c.innerHTML=paymentsPage();if(tab==='reports')c.innerHTML=reportsPage();bindPage()}
function dashboard(){const recv=balances.reduce((s,d)=>s+Math.max(0,Number(d.current_balance)),0),pay=balances.reduce((s,d)=>s+Math.max(0,-Number(d.current_balance)),0),routeSummary=summary.find(x=>x.route_id===route?.id)||{};return `
<div class="routebox"><span class="small">ACTIVE ROUTE · SALESMAN</span><strong>${route?.route_name||'No active route'}</strong><span class="small">Anayat Ali · ${route?.route_date||''} · ${route?.status||'—'}</span></div>
<div class="grid"><div class="stat"><small>Dealers</small><strong>${dealers.length}</strong><span class="hint">Registered dealers</span></div><div class="stat"><small>Receivables</small><strong>${fmt(recv)}</strong><span class="hint">Dealers owe you</span></div><div class="stat"><small>Payables</small><strong>${fmt(pay)}</strong><span class="hint">You owe dealers</span></div><div class="stat"><small>Current route sales</small><strong>${fmt(routeSummary.sales_total||0)}</strong><span class="hint">Route total</span></div></div>
<div class="split"><section class="panel"><div class="toolbar"><h2>Quick actions</h2><span class="tag">Live data</span></div><div class="actions"><button class="btn" data-go="sales">＋ Add Sale</button><button class="btn alt" data-go="stock">＋ Factory Stock</button><button class="btn alt" data-go="expenses">＋ Expense</button><button class="btn alt" data-go="payments">＋ Payment</button></div></section><section class="panel"><h2>Route summary</h2><div class="small">Gross sales</div><strong>${fmt(routeSummary.sales_total||0)}</strong><div class="small" style="margin-top:8px">Expenses</div><strong>${fmt(routeSummary.expenses_total||0)}</strong><div class="small" style="margin-top:8px">Estimated net profit</div><strong class="${Number(routeSummary.net_profit||0)>=0?'positive':'negative'}">${fmt(routeSummary.net_profit||0)}</strong></section></div>
<section class="panel"><div class="toolbar"><h2>Dealer balances · Priority order</h2><div class="actions"><span class="tag red">Payment Due</span><span class="tag">Cleared</span><span class="tag yellow">Credit Balance</span></div></div><div class="tablewrap"><table><thead><tr><th>Dealer</th><th>City</th><th>Balance</th></tr></thead><tbody>${balances.slice().sort((a,b)=>{const av=Number.parseFloat(a.current_balance??0)||0,bv=Number.parseFloat(b.current_balance??0)||0,g=v=>v>0?0:v===0?1:2;return g(av)-g(bv)||(g(av)===0?bv-av:g(av)===2?av-bv:String(a.name||'').localeCompare(String(b.name||'')))}).slice(0,8).map(d=>{const v=Number.parseFloat(d.current_balance??0)||0,cl=v>0?'dealer-row-receive':v<0?'dealer-row-pay':'dealer-row-clear',label=v>0?'Payment Due':v<0?'Credit Balance':'Cleared',badge=v>0?'tag red':v<0?'tag yellow':'tag';return `<tr class="${cl}"><td><strong>${esc(d.name)}</strong> <span class="${badge}">${label}</span></td><td>${esc(d.city||'—')}</td><td class="money ${v<0?'negative':'positive'}">${fmt(v)}</td></tr>`}).join('')}</tbody></table></div><button class="btn alt" data-go="dealers" style="margin-top:12px">View all dealers</button></section>`}
function dealerPage(){return `<section class="panel"><div class="toolbar"><h2>Dealer accounts (${dealers.length})</h2><input class="search" id="dealerSearch" placeholder="Search name, city or phone" style="max-width:260px"></div><div class="tablewrap"><table><thead><tr><th>Dealer</th><th>City</th><th>Phone</th><th>WhatsApp</th><th>Opening</th><th>Current balance</th></tr></thead><tbody id="dealerRows">${dealerRows(balances)}</tbody></table></div></section>`}
function whatsappLinks(phone){const nums=String(phone||'').split(/[\\/;,|]+/).map(x=>x.trim()).filter(Boolean);return nums.map((raw,i)=>{let n=raw.replace(/[^0-9]/g,'');if(n.startsWith('0'))n='92'+n.slice(1);else if(n.startsWith('92')){}else if(n.length===10)n='92'+n;return n.length>=11&&n.startsWith('92')?'<a class="btn alt" style="padding:6px 9px;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/'+n+'">WhatsApp '+(i+1)+'</a>':'<span class="small">Invalid number</span>';}).join('')||'<span class="small">No number</span>'} function dealerRows(rows){const amount=d=>Number.parseFloat(d.current_balance??0)||0;return rows.slice().sort((a,b)=>{const av=amount(a),bv=amount(b);const group=v=>v>0?0:v===0?1:2;return group(av)-group(bv)||(group(av)===0?bv-av:group(av)===2?av-bv:String(a.name||'').localeCompare(String(b.name||'')));}).map(d=>{const balance=amount(d),rowClass=balance>0?'dealer-row-receive':balance<0?'dealer-row-pay':'dealer-row-clear',tag=balance>0?'<span class="tag red">Payment Due</span>':balance<0?'<span class="tag yellow">Credit Balance</span>':'<span class="tag">Cleared</span>';return `<tr class="${rowClass}"><td><strong>${esc(d.name)}</strong> ${tag}</td><td>${esc(d.city||'—')}</td><td>${esc(d.phone||'—')}</td><td><div class="actions">${whatsappLinks(d.phone)}</div></td><td class="money">${fmt(d.opening_balance)}</td><td class="money ${balance<0?'negative':'positive'}">${fmt(d.current_balance)}</td></tr>`}).join('')}
function routePage(){const r=route||{};return `<section class="panel"><div class="toolbar"><h2>Current route</h2><span class="tag">${r.status||'No route'}</span></div><div class="routebox"><strong>${r.route_name||'No open route'}</strong><span class="small">Salesman: ${r.salesman||'—'} · Start: ${r.route_date||'—'} · Vehicle expenses paid by distributor</span></div><div class="actions" style="margin-top:14px"><button class="btn alt" id="routeNew" ${r.id?'disabled':''}>Start new route</button><button class="btn" id="routeClose" ${r.id?'':'disabled'}>Close route & calculate</button></div><div class="grid"><div class="stat"><small>Sales</small><strong>${fmt((summary.find(x=>x.route_id===r.id)||{}).sales_total)}</strong></div><div class="stat"><small>Expenses</small><strong>${fmt((summary.find(x=>x.route_id===r.id)||{}).expenses_total)}</strong></div><div class="stat"><small>Estimated profit</small><strong>${fmt((summary.find(x=>x.route_id===r.id)||{}).net_profit)}</strong></div><div class="stat"><small>Stock entries</small><strong>${loads.filter(x=>x.route_id===r.id).length}</strong></div></div><h2>Route history</h2><div class="tablewrap"><table><thead><tr><th>Date</th><th>Route</th><th>Salesman</th><th>Status</th></tr></thead><tbody>${summary.map(x=>`<tr><td>${x.route_date}</td><td>${esc(x.route_name)}</td><td>${esc(x.salesman)}</td><td>${x.status}</td></tr>`).join('')}</tbody></table></div></section>`}
function stockPage(){const ordered=products.slice().sort((a,b)=>(a.display_order||999)-(b.display_order||999));return `<section class="panel"><div class="toolbar"><div><h2>＋ Load Stock from Factory</h2><p class="small">Tap an item, enter boxes/packs and factory rate. It will be added to this route immediately.</p></div><span class="tag">${route?'Route active':'Start a route first'}</span></div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(170px,1fr));margin-top:14px">${ordered.map(p=>`<button class="stock-item" data-stock-product="${p.id}" ${route?'':'disabled'} style="text-align:left;background:#fff;border:1px solid #f0dce2;border-radius:16px;padding:16px;box-shadow:0 5px 16px #74334a0c;color:var(--ink)"><strong style="display:block;font-size:15px">${esc(p.name)}</strong><span class="small">${p.pack_quantity??'—'} ${esc(p.pack_unit||'')}</span><span style="display:block;color:#a83e62;font-weight:800;margin-top:8px">${p.factory_rate==null?'Enter rate':fmt(p.factory_rate)+' / pack'}</span><span class="small">＋ Add to route</span></button>`).join('')}</div></section><section class="panel"><h2>Stock added to this route</h2><div class="tablewrap"><table><thead><tr><th>Product</th><th>Boxes / Packs loaded</th><th>Factory rate</th><th>Total cost</th></tr></thead><tbody>${loads.filter(x=>x.route_id===route?.id).map(x=>`<tr><td><strong>${esc(x.product_name)}</strong></td><td>${x.quantity}</td><td>${fmt(x.purchase_rate)}</td><td class="money">${fmt(x.quantity*x.purchase_rate)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No stock loaded on this route yet.</td></tr>'}</tbody></table></div></section>`}function salesPage(){return `<section class="panel"><div class="toolbar"><h2>Dealer sales</h2><button class="btn" id="addSale" ${route?'':'disabled'}>＋ Add sale</button></div><p class="small">Dealer sales, quantity and variable sale rate enter separately.</p><div class="tablewrap"><table><thead><tr><th>Date</th><th>Dealer</th><th>Product</th><th>Qty</th><th>Rate</th><th>Total</th></tr></thead><tbody>${sales.map(s=>`<tr><td>${s.sold_at.slice(0,10)}</td><td>${esc(dealers.find(d=>d.id===s.dealer_id)?.name||'')}</td><td>${esc(s.sale_items?.[0]?.product_name||'—')}</td><td>${s.sale_items?.[0]?.quantity||'—'}</td><td>${fmt(s.sale_items?.[0]?.sale_rate||0)}</td><td class="money">${fmt((s.sale_items?.[0]?.quantity||0)*(s.sale_items?.[0]?.sale_rate||0))}</td></tr>`).join('')}</tbody></table></div></section>`}
function expensesPage(){return `<section class="panel"><div class="toolbar"><h2>Route expenses</h2><button class="btn" id="addExpense" ${route?'':'disabled'}>＋ Add expense</button></div><p class="small">Fuel, food, drinks, vehicle repair and other expenses can be recorded here.</p><div class="tablewrap"><table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Paid by</th><th>Amount</th></tr></thead><tbody>${expenses.map(e=>`<tr><td>${e.expense_date}</td><td>${esc(e.category)}</td><td>${esc(e.description||'')}</td><td>${esc(e.paid_by)}</td><td class="money">${fmt(e.amount)}</td></tr>`).join('')}</tbody></table></div></section>`}
function paymentsPage(){return `<section class="panel"><div class="toolbar"><h2>Dealer payments / Payments</h2><button class="btn" id="addPayment">＋ Record payment</button></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Dealer</th><th>Method</th><th>Amount</th><th>Notes</th></tr></thead><tbody>${payments.map(p=>`<tr><td>${p.paid_at.slice(0,10)}</td><td>${esc(dealers.find(d=>d.id===p.dealer_id)?.name||'')}</td><td>${esc(p.method)}</td><td class="money positive">${fmt(p.amount)}</td><td>${esc(p.notes||'')}</td></tr>`).join('')}</tbody></table></div></section>`}
function reportsPage(){const rec=balances.reduce((s,d)=>s+Math.max(0,Number(d.current_balance)),0),pay=balances.reduce((s,d)=>s+Math.max(0,-Number(d.current_balance)),0);return `<section class="panel"><h2>Accounts report</h2><div class="grid"><div class="stat"><small>Total receivables</small><strong>${fmt(rec)}</strong></div><div class="stat"><small>Total payables</small><strong>${fmt(pay)}</strong></div><div class="stat"><small>Net dealer balance</small><strong>${fmt(rec-pay)}</strong></div><div class="stat"><small>Registered dealers</small><strong>${dealers.length}</strong></div></div><div class="actions"><button class="btn alt" id="exportCsv">Export dealers CSV</button><button class="btn alt" id="printReport">Print / Save PDF</button></div><div class="tablewrap" style="margin-top:14px"><table><thead><tr><th>Dealer</th><th>City</th><th>Opening</th><th>Current balance</th></tr></thead><tbody>${dealerRows(balances)}</tbody></table></div></section>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function field(label,id,type='text',value='',required=true){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${required?'required':''}></div>`}
function options(rows,placeholder='Select'){return `<option value=""> ${placeholder} </option>`+rows.map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(x.city||'')}</option>`).join('')}
function bindPage(){
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()});
 $('#dealerSearch')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();$('#dealerRows').innerHTML=dealerRows(balances.filter(d=>[d.name,d.city,d.phone].join(' ').toLowerCase().includes(q)))});
 document.querySelectorAll('[data-stock-product]').forEach(b=>b.addEventListener('click',()=>{const p=products.find(x=>x.id===b.dataset.stockProduct);if(!p)return;openModal('Add '+p.name+' to route',`<form id="stockForm"><div class="routebox"><strong>${esc(p.name)}</strong><span class="small">Enter the quantity collected from factory</span></div>${field('Number of boxes / packs','qty','number')}${field('Factory rate per box / pack (PKR)','rate','number',p.factory_rate??'')}<div class="notice" id="stockTotal">Total: PKR 0</div><button class="btn" style="width:100%">Add stock to this route</button></form>`);const updateTotal=()=>{$('#stockTotal').textContent='Total: '+fmt((Number($('#qty').value)||0)*(Number($('#rate').value)||0))};$('#qty').addEventListener('input',updateTotal);$('#rate').addEventListener('input',updateTotal);$('#stockForm').addEventListener('submit',saveStock)}));
 $('#addSale')?.addEventListener('click',()=>openModal('New dealer sale',`<form id="saleForm"><div class="field"><label>Dealer</label><select id="dealer" required>${options(dealers)}</select></div><div class="field"><label>Product</label><select id="saleProduct" required><option value="">Select product</option>${productSelectOptions()}</select></div>${field('Quantity','sqty','number')}${field('Factory purchase cost per unit / pack (PKR)','cost','number','0')}${field('Dealer sale rate per unit / pack (PKR)','srate','number')}<div class="field"><label>Payment type</label><select id="ptype"><option value="credit">Credit</option><option value="cash">Cash</option><option value="partial">Partial</option></select></div><button class="btn">Save sale</button></form>`));
 $('#saleForm')?.addEventListener('submit',saveSale);$('#saleProduct')?.addEventListener('change',e=>{const p=products.find(x=>x.id===e.target.value);if(p)$('#cost').value=p.factory_rate??0;});
 $('#addExpense')?.addEventListener('click',()=>openModal('Route expense',`<form id="expenseForm"><div class="field"><label>Category</label><select id="cat"><option>Fuel / Diesel</option><option>Food</option><option>Drinks</option><option>Vehicle repair</option><option>Other</option></select></div>${field('Description','desc','text','',false)}${field('Amount (PKR)','amount','number')}<button class="btn">Save expense</button></form>`));
 $('#expenseForm')?.addEventListener('submit',saveExpense);
 $('#addPayment')?.addEventListener('click',()=>openModal('Dealer payment received',`<form id="paymentForm"><div class="field"><label>Dealer</label><select id="paydealer" required>${options(dealers)}</select></div>${field('Amount (PKR)','payamount','number')}<div class="field"><label>Method</label><select id="method"><option>cash</option><option>bank</option><option>easypaisa</option><option>jazzcash</option></select></div>${field('Notes','paynotes','text','',false)}<button class="btn">Save payment</button></form>`));
 $('#paymentForm')?.addEventListener('submit',savePayment);
 $('#routeNew')?.addEventListener('click',startRoute);$('#routeClose')?.addEventListener('click',closeRoute);
 $('#exportCsv')?.addEventListener('click',exportCSV);$('#printReport')?.addEventListener('click',()=>window.print());
}
function productSelectOptions(){return products.slice().sort((a,b)=>(a.display_order||999)-(b.display_order||999)).map(p=>`<option value="${p.id}">${esc(p.name)} · ${p.factory_rate==null?'Rate not listed':fmt(p.factory_rate)}</option>`).join('')}
async function saveStock(e){e.preventDefault();const p=products.find(x=>x.id===$('#stockProduct').value);if(!p)return alert('Select a factory product');const v={route_id:route.id,product_id:p.id,product_name:p.name,quantity:+$('#qty').value,purchase_rate:+$('#rate').value};const {error}=await sb.from('route_loads').insert(v);if(error)return alert(error.message);$('#modal').classList.add('hidden');await refresh();render()}
async function saveSale(e){e.preventDefault();const p=products.find(x=>x.id===$('#saleProduct').value);if(!p)return alert('Select a product');const {data:s,error}=await sb.from('sales').insert({route_id:route.id,dealer_id:$('#dealer').value,payment_type:$('#ptype').value}).select().single();if(error)return alert(error.message);const item={sale_id:s.id,product_name:p.name,quantity:+$('#sqty').value,purchase_rate:+$('#cost').value,sale_rate:+$('#srate').value};const {error:ie}=await sb.from('sale_items').insert(item);if(ie)return alert(ie.message);$('#modal').classList.add('hidden');await refresh();render()}
async function saveExpense(e){
 e.preventDefault();
 if(!route?.id)return alert('First Current Route Start a new route in Current Route before adding an expense.');
 const amount=Number($('#amount').value);
 if(!Number.isFinite(amount)||amount<=0)return alert('Enter a valid amount.');
 const payload={route_id:route.id,category:$('#cat').value,description:$('#desc').value.trim(),amount,paid_by:'Distributor'};
 const {error}=await sb.from('route_expenses').insert(payload);
 if(error){console.error('Expense save failed',error);return alert('Expense was not saved: '+error.message);}
 $('#modal').classList.add('hidden');
 await refresh();render();alert('Expense saved successfully.');
}
async function savePayment(e){e.preventDefault();const {error}=await sb.from('dealer_payments').insert({dealer_id:$('#paydealer').value,route_id:route?.id||null,amount:+$('#payamount').value,method:$('#method').value,notes:$('#paynotes').value});if(error)return alert(error.message);$('#modal').classList.add('hidden');await refresh();render()}
async function startRoute(){const {error}=await sb.from('routes').insert({salesman:'Anayat Ali',route_name:'Piplan → Sargodha → Farooqabad',route_date:dateNow(),status:'open',vehicle_expense_paid_by:'Distributor'});if(error)return alert(error.message);await refresh();render()}
async function closeRoute(){
 if(!route?.id)return alert('There is no active route.');
 if(!confirm('Are you sure you want to close this route?'))return;
 const routeId=route.id;
 const {data:x,error:se}=await sb.from('route_profit_summary').select('*').eq('route_id',routeId).maybeSingle();
 if(se)return alert('Could not load route totals: '+se.message);
 const {data:ex,error:ee}=await sb.from('route_expenses').select('amount').eq('route_id',routeId);
 if(ee)return alert('Could not load route expenses: '+ee.message);
 const expenseTotal=(ex||[]).reduce((n,v)=>n+Number(v.amount||0),0);
 const salesTotal=Number(x?.sales_total||0),costTotal=Number(x?.cost_of_goods||0);
 const closing={route_id:routeId,sales_total:salesTotal,cost_of_goods:costTotal,expenses_total:expenseTotal,gross_profit:salesTotal-costTotal,net_profit:salesTotal-costTotal-expenseTotal,notes:'Closed from web app'};
 const {error:ce}=await sb.from('route_closings').upsert(closing,{onConflict:'route_id'});
 if(ce)return alert('Closing Closing totals were not saved. The route is still open.: '+ce.message);
 const {data:updated,error}=await sb.from('routes').update({status:'closed',end_date:dateNow(),closed_at:new Date().toISOString()}).eq('id',routeId).eq('status','open').select('id').maybeSingle();
 if(error)return alert('Closing Closing totals were saved, but the route could not be closed.: '+error.message);
 if(!updated)return alert('روٹ First ہی بند ہو چکا ہے یا اب فعال نہیں ہے۔');
 await refresh();render();alert('Route closed successfully.');
}
function exportCSV(){const rows=[['Dealer','City','Phone','Opening balance','Current balance'],...balances.map(d=>[d.name,d.city,d.phone,d.opening_balance,d.current_balance])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='marco-dealer-balances.csv';a.click();URL.revokeObjectURL(a.href)}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b){tab=b.dataset.tab;render()}});
sb.auth.onAuthStateChange((_event,session)=>{if(!session){$('#app').classList.add('hidden');$('#login').classList.remove('hidden')}});
boot();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script><script src="./dealer-accounts.js?v=27"></script>
<script>
/* Separate completed-route archive and full route detail screen */
let closedRouteRows=[], routeClosings=[], historyReturns=[], selectedClosedRouteId=null, showArchivedRoutes=false;
const routeHistoryRefreshBase=refresh;
refresh=async function(){
 await routeHistoryRefreshBase();
 const [rr,cc,rt]=await Promise.all([
  sb.from('routes').select('*').order('created_at',{ascending:false}),
  sb.from('route_closings').select('*'),
  sb.from('route_returns').select('*')
 ]);
 if(rr.error)throw rr.error;
 if(cc.error)throw cc.error;
 if(rt.error)throw rt.error;
 closedRouteRows=rr.data||[];
 routeClosings=cc.data||[];
 historyReturns=rt.data||[];
};
const originalRenderWithHistory=render;
render=function(){
 nav();
 const c=$('#content');
 if(tab==='completed'){c.innerHTML=selectedClosedRouteId?completedRouteDetail(selectedClosedRouteId):completedRoutesPage();bindCompletedRoutes();return;}
 originalRenderWithHistory();
};
function routeFactoryCost(id){return loads.filter(x=>x.route_id===id).reduce((n,x)=>n+Number(x.quantity||0)*Number(x.purchase_rate||0),0)}
function routeNums(r){const s=summary.find(x=>x.route_id===r.id)||{},cl=routeClosings.find(x=>x.route_id===r.id)||{};return {sales:Number(s.sales_total??cl.sales_total??0),exp:Number(s.expenses_total??cl.expenses_total??0),cogs:Number(s.cost_of_goods??cl.cost_of_goods??0),profit:Number(s.net_profit??cl.net_profit??0),factory:routeFactoryCost(r.id)}}
function completedRoutesPage(){
  const rows=closedRouteRows;
  const t=rows.reduce((a,r)=>{const n=routeNums(r);a.sales+=n.sales;a.exp+=n.exp;a.profit+=n.profit;a.factory+=n.factory;return a},{sales:0,exp:0,profit:0,factory:0});
  return '<section class="panel"><div class="toolbar"><div><h2>All Routes</h2><span class="small">Har route par click karo (View Details) to uska poora hisab khul jayega: factory se maal, sale, expenses aur profit.</span></div><span class="tag">'+rows.length+' Routes</span></div>'+
  '<div class="grid"><div class="stat"><small>Total Factory Maal (cost)</small><strong>'+fmt(t.factory)+'</strong></div><div class="stat"><small>Total Sales</small><strong>'+fmt(t.sales)+'</strong></div><div class="stat"><small>Total Expenses</small><strong>'+fmt(t.exp)+'</strong></div><div class="stat"><small>Total Net Profit</small><strong class="'+(t.profit>=0?'positive':'negative')+'">'+fmt(t.profit)+'</strong></div></div>'+
  (rows.length?'<div class="tablewrap"><table><thead><tr><th>Date</th><th>Route</th><th>Status</th><th>Factory Maal</th><th>Sales</th><th>Expenses</th><th>Net Profit</th><th>Details</th></tr></thead><tbody>'+
  rows.map(r=>{const n=routeNums(r);return '<tr><td>'+esc(r.route_date||'—')+'</td><td><strong>'+esc(r.route_name||'Route')+'</strong><div class="small">'+esc(r.salesman||'')+'</div></td><td><span class="tag">'+(r.status==='open'?'OPEN':'CLOSED')+'</span></td><td class="money">'+fmt(n.factory)+'</td><td class="money">'+fmt(n.sales)+'</td><td class="money">'+fmt(n.exp)+'</td><td class="money '+(n.profit>=0?'positive':'negative')+'">'+fmt(n.profit)+'</td><td><button class="btn alt" data-open-closed-route="'+r.id+'">View Details →</button></td></tr>';}).join('')+
  '</tbody></table></div>':'<div class="empty">Abhi koi route nahi. Route start karoge to yahan nazar aayega.</div>')+'</section>';
}
function completedRouteDetail(id){
 const r=closedRouteRows.find(x=>x.id===id);if(!r)return '<section class="panel"><button class="btn alt" id="backCompletedRoutes">← Back</button><p class="empty">Route not found.</p></section>';
 const s=summary.find(x=>x.route_id===id)||{},cl=routeClosings.find(x=>x.route_id===id)||{};
 const routeLoads=loads.filter(x=>x.route_id===id),routeSales=sales.filter(x=>x.route_id===id),routeExpenses=expenses.filter(x=>x.route_id===id),returns=routeReturns.filter(x=>x.route_id===id);
 const stock=routeStockRows(id);
 const totalLoaded=stock.reduce((n,x)=>n+x.loaded,0),totalSold=stock.reduce((n,x)=>n+x.sold,0),totalReturned=stock.reduce((n,x)=>n+x.returned,0);
 return '<section class="panel"><div class="toolbar"><div><button class="btn alt" id="backCompletedRoutes">← Back to All Routes</button><h2 style="margin-top:14px">Route Details</h2><div class="small">'+(r.status==='open'?'Route abhi OPEN hai (profit abhi tak ka hisab hai)':'Closed on '+esc((r.closed_at||r.end_date||'').toString().slice(0,10)))+'</div></div><span class="tag">'+(r.status==='open'?'OPEN':'CLOSED')+'</span></div>'+
 '<div class="routebox"><strong>'+esc(r.route_name||'Route')+'</strong><span class="small">Route date: '+esc(r.route_date||'—')+' · Salesman: '+esc(r.salesman||'—')+'</span></div>'+
 '<div class="grid"><div class="stat"><small>Factory se liya (cost)</small><strong>'+fmt(routeFactoryCost(id))+'</strong></div><div class="stat"><small>Total Sales</small><strong>'+fmt(s.sales_total??cl.sales_total??0)+'</strong></div><div class="stat"><small>Expenses</small><strong>'+fmt(s.expenses_total??cl.expenses_total??0)+'</strong></div><div class="stat"><small>Cost of Goods</small><strong>'+fmt(s.cost_of_goods??cl.cost_of_goods??0)+'</strong></div><div class="stat"><small>Net Profit</small><strong class="'+(Number(s.net_profit??cl.net_profit??0)>=0?'positive':'negative')+'">'+fmt(s.net_profit??cl.net_profit??0)+'</strong></div></div>'+
 '<section class="panel"><h2>Stock Account</h2><div class="grid"><div class="stat"><small>Loaded</small><strong>'+totalLoaded+'</strong></div><div class="stat"><small>Sold</small><strong>'+totalSold+'</strong></div><div class="stat"><small>Returned</small><strong>'+totalReturned+'</strong></div><div class="stat"><small>In Vehicle</small><strong>'+stock.reduce((n,x)=>n+x.remaining,0)+'</strong></div></div>'+
 (stock.length?'<div class="tablewrap"><table><thead><tr><th>Item</th><th>Loaded</th><th>Sold</th><th>Returned</th><th>In Vehicle</th></tr></thead><tbody>'+stock.map(x=>'<tr><td><strong>'+esc(x.p.name)+'</strong></td><td>'+x.loaded+'</td><td>'+x.sold+'</td><td>'+x.returned+'</td><td>'+x.remaining+'</td></tr>').join('')+'</tbody></table></div>':'<p class="small">No stock records.</p>')+'</section>'+
 '<section class="panel"><h2>Factory Stock Entries</h2><div class="tablewrap"><table><thead><tr><th>Product</th><th>Source</th><th>Quantity</th><th>Factory Rate</th><th>Total Cost</th></tr></thead><tbody>'+ (routeLoads.map(x=>'<tr><td>'+esc(x.product_name)+'</td><td>'+((x.source||'factory')==='carry_forward'?'Carried Forward':'Factory')+'</td><td>'+x.quantity+'</td><td>'+fmt(x.purchase_rate)+'</td><td>'+fmt(Number(x.quantity||0)*Number(x.purchase_rate||0))+'</td></tr>').join('')||'<tr><td colspan="5" class="empty">No factory stock entries.</td></tr>')+'</tbody></table></div></section>'+
 '<section class="panel"><h2>Dealer Sales</h2><div class="tablewrap"><table><thead><tr><th>Date</th><th>Dealer</th><th>Items</th><th>Quantity</th><th>Bill Total</th><th>Payment</th></tr></thead><tbody>'+ (routeSales.map(x=>{const items=x.sale_items||[],total=items.reduce((n,i)=>n+Number(i.quantity||0)*Number(i.sale_rate||0),0);return '<tr><td>'+esc((x.sold_at||'').slice(0,10))+'</td><td>'+esc(dealers.find(d=>d.id===x.dealer_id)?.name||'—')+'</td><td>'+esc(items.map(i=>i.product_name).join(', '))+'</td><td>'+items.reduce((n,i)=>n+Number(i.quantity||0),0)+'</td><td class="money">'+fmt(total)+'</td><td>'+esc(x.payment_type||'—')+'</td></tr>';}).join('')||'<tr><td colspan="6" class="empty">No sales on this route.</td></tr>')+'</tbody></table></div></section>'+
 '<section class="panel"><h2>Returned Stock</h2><div class="tablewrap"><table><thead><tr><th>Product</th><th>Returned Quantity</th><th>Factory Rate</th><th>Stock Value</th></tr></thead><tbody>'+ (returns.map(x=>'<tr><td>'+esc(x.product_name)+'</td><td>'+x.quantity+'</td><td>'+fmt(x.purchase_rate)+'</td><td>'+fmt(Number(x.quantity||0)*Number(x.purchase_rate||0))+'</td></tr>').join('')||'<tr><td colspan="4" class="empty">No returned stock recorded.</td></tr>')+'</tbody></table></div></section>'+
 '<section class="panel"><h2>Route Expenses</h2><div class="tablewrap"><table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Paid By</th><th>Amount</th></tr></thead><tbody>'+ (routeExpenses.map(x=>'<tr><td>'+esc(x.expense_date||'—')+'</td><td>'+esc(x.category||'—')+'</td><td>'+esc(x.description||'')+'</td><td>'+esc(x.paid_by||'—')+'</td><td class="money">'+fmt(x.amount)+'</td></tr>').join('')||'<tr><td colspan="5" class="empty">No expenses recorded.</td></tr>')+'</tbody></table></div></section>'+
 '<section class="panel"><h2>Closing Notes</h2><p>'+esc(cl.notes||'No closing notes.')+'</p></section></section>';
}
function bindCompletedRoutes(){
 $('#backCompletedRoutes')?.addEventListener('click',()=>{selectedClosedRouteId=null;render()});
 const content=$('#content');
 content?.addEventListener('click',e=>{const b=e.target.closest('[data-open-closed-route]');if(b){selectedClosedRouteId=b.dataset.openClosedRoute;render();}}, {once:true});
}
const historyNavButton=document.createElement('button');historyNavButton.dataset.tab='completed';historyNavButton.textContent='Route History';$('#nav').insertBefore(historyNavButton,$('#nav').children[1]||null);
if(currentUser)refresh().then(()=>render()).catch(e=>alert('Completed route history could not be loaded: '+e.message));
</script>

<script>
/* Route history: searchable date-wise and bill-number-wise archive */
completedRoutesPage = function(){
 const rows=closedRouteRows.filter(r=>showArchivedRoutes||!r.archived_at);
 const t=rows.reduce((a,r)=>{const n=routeNums(r);a.sales+=n.sales;a.exp+=n.exp;a.profit+=n.profit;a.factory+=n.factory;return a},{sales:0,exp:0,profit:0,factory:0});
 return '<section class="panel"><div class="toolbar"><div><h2>Route History</h2><span class="small">Archive keeps the complete route record safely. Delete is restricted to empty routes.</span></div><span class="tag">'+rows.length+' Routes</span></div>'+
 '<div class="grid"><div class="stat"><small>Total Factory Cost</small><strong>'+fmt(t.factory)+'</strong></div><div class="stat"><small>Total Sales</small><strong>'+fmt(t.sales)+'</strong></div><div class="stat"><small>Total Expenses</small><strong>'+fmt(t.exp)+'</strong></div><div class="stat"><small>Total Net Profit</small><strong>'+fmt(t.profit)+'</strong></div></div>'+
 '<section class="panel"><h2>Find Route / Bill</h2><div class="formgrid"><div class="field"><label>Route, City, Salesman or Bill Number</label><input id="routeHistorySearch" placeholder="Search route or bill number"></div><div class="field"><label>Start Date</label><input id="routeDateFrom" type="date"></div><div class="field"><label>End Date</label><input id="routeDateTo" type="date"></div></div><label style="display:flex;gap:8px;align-items:center;margin:8px 0"><input id="showArchivedRoutes" type="checkbox" '+(showArchivedRoutes?'checked':'')+'> Show archived routes</label></section>'+
 (rows.length?'<div class="tablewrap"><table><thead><tr><th>Route Date</th><th>Route</th><th>Bill Numbers</th><th>Salesman</th><th>Status</th><th>Sales</th><th>Expenses</th><th>Net Profit</th><th>Details</th><th>Actions</th></tr></thead><tbody id="routeHistoryRows">'+
 rows.map(r=>{const n=routeNums(r),rs=sales.filter(x=>x.route_id===r.id),billNos=rs.map(x=>x.bill_number||x.id).join(', '),search=[r.route_name,r.salesman,billNos].join(' ').toLowerCase();return '<tr data-search="'+esc(search)+'" data-date="'+esc(r.route_date||'')+'"><td>'+esc(r.route_date||'—')+'</td><td><strong>'+esc(r.route_name||'Route')+'</strong></td><td style="white-space:normal;min-width:160px">'+(billNos?esc(billNos):'<span class="muted">No bills</span>')+'</td><td>'+esc(r.salesman||'')+'</td><td><span class="tag">'+(r.archived_at?'ARCHIVED':r.status==='open'?'OPEN':'CLOSED')+'</span></td><td class="money">'+fmt(n.sales)+'</td><td class="money">'+fmt(n.exp)+'</td><td class="money '+(n.profit>=0?'positive':'negative')+'">'+fmt(n.profit)+'</td><td><button class="btn alt" data-open-closed-route="'+r.id+'">View Details</button></td><td><div class="actions">'+(r.archived_at?'<button class="btn alt" data-restore-route="'+r.id+'">Restore</button>':r.status==='closed'?'<button class="btn alt" data-archive-route="'+r.id+'">Archive</button>':'<span class="small">Close route first</span>')+'<button class="btn red" data-delete-route="'+r.id+'">Delete</button></div></td></tr>';}).join('')+
 '</tbody></table></div>':'<div class="empty">No routes in this view.</div>')+'</section>';
};
completedRouteDetail = function(id){
 const r=closedRouteRows.find(x=>x.id===id);
 if(!r)return '<section class="panel"><button class="btn alt" id="backCompletedRoutes">Back</button><p class="empty">Route not found.</p></section>';
 const s=summary.find(x=>x.route_id===id)||{},cl=routeClosings.find(x=>x.route_id===id)||{};
 const routeLoads=loads.filter(x=>x.route_id===id),routeSales=sales.filter(x=>x.route_id===id),routeExpenses=expenses.filter(x=>x.route_id===id),returns=historyReturns.filter(x=>x.route_id===id),routePayments=payments.filter(x=>x.route_id===id);
 const stock=products.filter(p=>p.active!==false).map(p=>{
  const loaded=routeLoads.filter(x=>x.product_id===p.id||(!x.product_id&&String(x.product_name||'').toLowerCase()===String(p.name||'').toLowerCase())).reduce((n,x)=>n+Number(x.quantity||0),0);
  const sold=routeSales.flatMap(x=>x.sale_items||[]).filter(x=>x.product_id===p.id||(!x.product_id&&String(x.product_name||'').toLowerCase()===String(p.name||'').toLowerCase())).reduce((n,x)=>n+Number(x.quantity||0),0);
  const returned=returns.filter(x=>x.product_id===p.id).reduce((n,x)=>n+Number(x.quantity||0),0);
  return {p,loaded,sold,returned,remaining:loaded-sold-returned};
 }).filter(x=>x.loaded||x.sold||x.returned);
 const totalLoaded=stock.reduce((n,x)=>n+x.loaded,0),totalSold=stock.reduce((n,x)=>n+x.sold,0),totalReturned=stock.reduce((n,x)=>n+x.returned,0);
 const totals=routeNums(r);
 return '<section class="panel"><div class="toolbar"><div><button class="btn alt" id="backCompletedRoutes">Back to Route History</button><h2 style="margin-top:14px">Route Details</h2><div class="small">'+(r.status==='open'?'Route is currently OPEN':'Closed on '+esc((r.closed_at||r.end_date||'').toString().slice(0,10)))+'</div></div><span class="tag">'+(r.status==='open'?'OPEN':'CLOSED')+'</span></div>'+
 '<div class="routebox"><strong>'+esc(r.route_name||'Route')+'</strong><span class="small">Route date: '+esc(r.route_date||'—')+' · Salesman: '+esc(r.salesman||'—')+'</span></div>'+
 '<div class="grid"><div class="stat"><small>Factory Stock Cost</small><strong>'+fmt(totals.factory)+'</strong></div><div class="stat"><small>Total Sales</small><strong>'+fmt(totals.sales)+'</strong></div><div class="stat"><small>Route Expenses</small><strong>'+fmt(totals.exp)+'</strong></div><div class="stat"><small>Cost of Goods Sold</small><strong>'+fmt(totals.cogs)+'</strong></div><div class="stat"><small>Net Profit / Loss</small><strong class="'+(totals.profit>=0?'positive':'negative')+'">'+fmt(totals.profit)+'</strong></div></div>'+
 '<section class="panel"><h2>Stock Account</h2><div class="grid"><div class="stat"><small>Loaded</small><strong>'+totalLoaded+'</strong></div><div class="stat"><small>Sold</small><strong>'+totalSold+'</strong></div><div class="stat"><small>Returned</small><strong>'+totalReturned+'</strong></div><div class="stat"><small>In Vehicle</small><strong>'+stock.reduce((n,x)=>n+x.remaining,0)+'</strong></div></div>'+
 (stock.length?'<div class="tablewrap"><table><thead><tr><th>Item</th><th>Loaded</th><th>Sold</th><th>Returned</th><th>In Vehicle</th></tr></thead><tbody>'+stock.map(x=>'<tr><td>'+esc(x.p.name)+'</td><td>'+x.loaded+'</td><td>'+x.sold+'</td><td>'+x.returned+'</td><td>'+x.remaining+'</td></tr>').join('')+'</tbody></table></div>':'<p class="small">No stock records.</p>')+'</section>'+
 '<section class="panel"><h2>Factory Stock Bills / Entries</h2><div class="tablewrap"><table><thead><tr><th>Date</th><th>Product</th><th>Source</th><th>Quantity</th><th>Factory Rate</th><th>Total Cost</th></tr></thead><tbody>'+(routeLoads.map(x=>'<tr><td>'+esc((x.created_at||'').slice(0,10))+'</td><td>'+esc(x.product_name)+'</td><td>'+((x.source||'factory')==='carry_forward'?'Carried Forward':'Factory')+'</td><td>'+x.quantity+'</td><td>'+fmt(x.purchase_rate)+'</td><td>'+fmt(Number(x.quantity||0)*Number(x.purchase_rate||0))+'</td></tr>').join('')||'<tr><td colspan="6" class="empty">No factory stock entries.</td></tr>')+'</tbody></table></div></section>'+
 '<section class="panel"><h2>Dealer Bills</h2><div class="tablewrap"><table><thead><tr><th>Bill Number</th><th>Date</th><th>Dealer</th><th>Items</th><th>Quantity</th><th>Bill Total</th><th>Payment Type</th></tr></thead><tbody>'+(routeSales.map(x=>{const items=x.sale_items||[],total=items.reduce((n,i)=>n+Number(i.quantity||0)*Number(i.sale_rate||0),0);return '<tr><td><strong>'+esc(x.bill_number||x.id)+'</strong></td><td>'+esc((x.sold_at||'').slice(0,10))+'</td><td>'+esc(dealers.find(d=>d.id===x.dealer_id)?.name||'—')+'</td><td style="white-space:normal">'+esc(items.map(i=>i.product_name).join(', '))+'</td><td>'+items.reduce((n,i)=>n+Number(i.quantity||0),0)+'</td><td class="money">'+fmt(total)+'</td><td>'+esc(x.payment_type||'—')+'</td></tr>';}).join('')||'<tr><td colspan="7" class="empty">No dealer bills on this route.</td></tr>')+'</tbody></table></div></section>'+
 '<section class="panel"><h2>Dealer Payments Received</h2><div class="tablewrap"><table><thead><tr><th>Date</th><th>Dealer</th><th>Method</th><th>Reference / Notes</th><th>Amount</th></tr></thead><tbody>'+(routePayments.map(x=>'<tr><td>'+esc((x.paid_at||'').slice(0,10))+'</td><td>'+esc(dealers.find(d=>d.id===x.dealer_id)?.name||'—')+'</td><td>'+esc(x.method||'—')+'</td><td>'+esc(x.notes||'—')+'</td><td class="money">'+fmt(x.amount)+'</td></tr>').join('')||'<tr><td colspan="5" class="empty">No payments recorded on this route.</td></tr>')+'</tbody></table></div></section>'+
 '<section class="panel"><h2>Returned Stock</h2><div class="tablewrap"><table><thead><tr><th>Product</th><th>Returned Quantity</th><th>Factory Rate</th><th>Stock Value</th></tr></thead><tbody>'+(returns.map(x=>'<tr><td>'+esc(x.product_name)+'</td><td>'+x.quantity+'</td><td>'+fmt(x.purchase_rate)+'</td><td>'+fmt(Number(x.quantity||0)*Number(x.purchase_rate||0))+'</td></tr>').join('')||'<tr><td colspan="4" class="empty">No returned stock recorded.</td></tr>')+'</tbody></table></div></section>'+
 '<section class="panel"><h2>Route Expenses</h2><div class="tablewrap"><table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Paid By</th><th>Amount</th></tr></thead><tbody>'+(routeExpenses.map(x=>'<tr><td>'+esc(x.expense_date||'—')+'</td><td>'+esc(x.category||'—')+'</td><td>'+esc(x.description||'')+'</td><td>'+esc(x.paid_by||'—')+'</td><td class="money">'+fmt(x.amount)+'</td></tr>').join('')||'<tr><td colspan="5" class="empty">No expenses recorded.</td></tr>')+'</tbody></table></div></section>'+
 '<section class="panel"><h2>Closing Statement</h2><div class="grid"><div class="stat"><small>Sales</small><strong>'+fmt(cl.sales_total??totals.sales)+'</strong></div><div class="stat"><small>Expenses</small><strong>'+fmt(cl.expenses_total??totals.exp)+'</strong></div><div class="stat"><small>Gross Profit</small><strong>'+fmt(cl.gross_profit??(totals.sales-totals.cogs))+'</strong></div><div class="stat"><small>Net Profit</small><strong>'+fmt(cl.net_profit??totals.profit)+'</strong></div></div><p>'+esc(cl.notes||'No closing notes.')+'</p></section></section>';
};
bindCompletedRoutes = function(){
 const content=$('#content');
 content.onclick=async e=>{
  const open=e.target.closest('[data-open-closed-route]');
  if(open){selectedClosedRouteId=open.dataset.openClosedRoute;render();return;}
  const archive=e.target.closest('[data-archive-route]'),restore=e.target.closest('[data-restore-route]'),del=e.target.closest('[data-delete-route]');
  if(archive||restore){
   const id=(archive||restore).dataset[archive?'archiveRoute':'restoreRoute'],action=archive?'archive':'restore';
   if(!confirm(action==='archive'?'Archive this route? All bills and accounts will remain saved.':'Restore this route to Route History?'))return;
   const {error}=await sb.from('routes').update({archived_at:action==='archive'?new Date().toISOString():null}).eq('id',id);
   if(error){alert('Could not '+action+' route: '+error.message);return;} await refresh();render();return;
  }
  if(del){
   const id=del.dataset.deleteRoute;
   const hasRecords=sales.some(x=>x.route_id===id)||loads.some(x=>x.route_id===id)||expenses.some(x=>x.route_id===id)||payments.some(x=>x.route_id===id)||historyReturns.some(x=>x.route_id===id)||routeClosings.some(x=>x.route_id===id);
   if(hasRecords){alert('This route has bills, payments, stock or expenses. Archive it instead to protect its financial history.');return;}
   if(!confirm('Permanently delete this empty route? This cannot be undone.'))return;
   const {error}=await sb.from('routes').delete().eq('id',id);
   if(error){alert('Could not delete route: '+error.message);return;} await refresh();render();
  }
 };
 $('#backCompletedRoutes')?.addEventListener('click',()=>{selectedClosedRouteId=null;render()});
 $('#showArchivedRoutes')?.addEventListener('change',e=>{showArchivedRoutes=e.target.checked;render()});
 const filter=()=>{const q=($('#routeHistorySearch')?.value||'').trim().toLowerCase(),from=$('#routeDateFrom')?.value||'',to=$('#routeDateTo')?.value||'';document.querySelectorAll('#routeHistoryRows tr').forEach(row=>{const d=row.dataset.date||'',okText=!q||(row.dataset.search||'').includes(q),okFrom=!from||d>=from,okTo=!to||d<=to;row.classList.toggle('hidden',!(okText&&okFrom&&okTo));});};
 ['routeHistorySearch','routeDateFrom','routeDateTo'].forEach(id=>$('#'+id)?.addEventListener('input',filter));
};
</script>

<script>
/* Container stock flow: leftover from a closed route is carried into the next route. */
const marcoOriginalCloseRoute = closeRoute;
const marcoOriginalDashboard = dashboard;
const marcoOriginalRoutePage = routePage;
const marcoOriginalBindPage = bindPage;
const marcoOriginalStockPage = stockPage;
stockPage = function(){
 const base=marcoOriginalStockPage();
 const pending=(routeReturns||[]).filter(x=>!x.carried_to_route_id&&Number(x.quantity)>0);
 const grouped=products.map(p=>({p,qty:pending.filter(x=>x.product_id===p.id||(!x.product_id&&String(x.product_name||'').toLowerCase()===String(p.name||'').toLowerCase())).reduce((n,x)=>n+Number(x.quantity||0),0)})).filter(x=>x.qty>0);
 const table=grouped.length?'<div class="tablewrap"><table><thead><tr><th>Ice Cream Item</th><th>Container Quantity</th><th>Factory Rate</th><th>Stock Value</th></tr></thead><tbody>'+grouped.map(x=>'<tr><td><strong>'+esc(x.p.name)+'</strong></td><td>'+x.qty+'</td><td>'+fmt(x.p.factory_rate||0)+'</td><td>'+fmt(x.qty*Number(x.p.factory_rate||0))+'</td></tr>').join('')+'</tbody></table></div>':'<p class="small">Container is currently empty. Returned stock from a completed route will appear here.</p>';
 return base+'<section class="panel"><h2>Container Stock · Available for Next Route</h2>'+table+'</section>';
};


dashboard = function(){
 const base=marcoOriginalDashboard();
 const pending=(routeReturns||[]).filter(x=>!x.carried_to_route_id).reduce((n,x)=>n+Number(x.quantity||0),0);
 return base + '<section class="panel"><h2>Container Stock</h2><div class="stat"><small>Available for next route</small><strong>'+pending+' units / packs</strong></div><p class="small">Stock returned from the previous route is kept here and automatically added when you start the next route.</p></section>';
};
routePage = function(){
 return marcoOriginalRoutePage() + '<section class="panel"><h2>Route Stock Handover</h2><p class="small">When this route finishes, close it to move the unsold stock into Container Stock. The next route will receive it automatically.</p><button class="btn" id="containerCloseRoute" '+(route?.id?'':'disabled')+'>Return Remaining Stock to Container & Close Route</button></section>';
};
bindPage = function(){
 marcoOriginalBindPage();
 $('#containerCloseRoute')?.addEventListener('click',closeRoute);
 $('#homeContainerCloseRoute')?.addEventListener('click',closeRoute);
};

startRoute = async function(){
 if(route?.id)return alert('A route is already open. Close it before starting the next route.');
 const {data:r,error}=await sb.from('routes').insert({
  salesman:'Anayat Ali',route_name:'Piplan → Sargodha → Farooqabad',
  route_date:dateNow(),status:'open',vehicle_expense_paid_by:'Distributor'
 }).select().single();
 if(error)return alert('Route could not be started: '+error.message);
 const {data:pending,error:pe}=await sb.from('route_returns').select('*').is('carried_to_route_id',null).gt('quantity',0).order('created_at');
 if(pe){await sb.from('routes').delete().eq('id',r.id);return alert('Container stock could not be loaded: '+pe.message);}
 if(pending?.length){
  const rows=pending.map(x=>({
   route_id:r.id,product_id:x.product_id,product_name:x.product_name,
   quantity:Number(x.quantity),purchase_rate:Number(x.purchase_rate||0),source:'carry_forward'
  }));
  const {error:le}=await sb.from('route_loads').insert(rows);
  if(le){await sb.from('routes').delete().eq('id',r.id);return alert('Route started but carried stock could not be loaded. Please retry: '+le.message);}
  const ids=pending.map(x=>x.id);
  const {error:ue}=await sb.from('route_returns').update({carried_to_route_id:r.id}).in('id',ids);
  if(ue){
   await sb.from('route_loads').delete().eq('route_id',r.id);
   await sb.from('routes').delete().eq('id',r.id);
   return alert('Container stock transfer was not completed, so the route start was rolled back: '+ue.message);
  }
 }
 await refresh();render();
 alert(pending?.length?'Route started. Previous container stock has been added automatically.':'Route started. No old stock was waiting in the container.');
};

closeRoute = async function(){
 if(!route?.id)return alert('There is no active route.');
 const routeId=route.id;
 const rows=routeStockRows(routeId).filter(x=>Number(x.remaining)>0);
 const preview=rows.length?rows.map(x=>'<tr><td>'+esc(x.p.name)+'</td><td>'+x.remaining+'</td><td>'+fmt(x.p.factory_rate||0)+'</td></tr>').join(''):'<tr><td colspan="3">No remaining stock to return.</td></tr>';
 openModal('Return Stock to Container & Close Route',
  '<p class="small">The following unsold stock will be saved in Container Stock and automatically loaded on the next route.</p>'+
  '<div class="tablewrap"><table><thead><tr><th>Ice Cream Item</th><th>Returned to Container</th><th>Factory Rate</th></tr></thead><tbody>'+preview+'</tbody></table></div>'+
  '<p class="notice">This will close the current route. All dealer bills, payments and expenses will remain saved.</p>'+
  '<div class="actions"><button type="button" class="btn alt" id="cancelContainerClose">Cancel</button><button type="button" class="btn" id="confirmContainerClose">Save Container Stock & Close Route</button></div>');
 $('#cancelContainerClose').onclick=()=>$('#modal').classList.add('hidden');
 $('#confirmContainerClose').onclick=async()=>{
  const btn=$('#confirmContainerClose');btn.disabled=true;btn.textContent='Saving…';
  if(rows.length){
   const payload=rows.map(x=>({
    route_id:routeId,product_id:x.p.id,product_name:x.p.name,
    quantity:Number(x.remaining),purchase_rate:Number(x.p.factory_rate||0)
   }));
   const {error}=await sb.from('route_returns').insert(payload);
   if(error){btn.disabled=false;btn.textContent='Save Container Stock & Close Route';return alert('Container stock was not saved: '+error.message);}
  }
  $('#modal').classList.add('hidden');
  const {data:x,error:se}=await sb.from('route_profit_summary').select('*').eq('route_id',routeId).maybeSingle();
  if(se)return alert('Container stock is saved, but route totals could not be loaded: '+se.message);
  const {data:ex,error:ee}=await sb.from('route_expenses').select('amount').eq('route_id',routeId);
  if(ee)return alert('Container stock is saved, but route expenses could not be loaded: '+ee.message);
  const expenseTotal=(ex||[]).reduce((n,v)=>n+Number(v.amount||0),0);
  const salesTotal=Number(x?.sales_total||0),costTotal=Number(x?.cost_of_goods||0);
  const closing={route_id:routeId,sales_total:salesTotal,cost_of_goods:costTotal,expenses_total:expenseTotal,gross_profit:salesTotal-costTotal,net_profit:salesTotal-costTotal-expenseTotal,notes:'Closed with container stock handover'};
  const {error:ce}=await sb.from('route_closings').upsert(closing,{onConflict:'route_id'});
  if(ce)return alert('Container stock is saved, but route closing failed: '+ce.message);
  const {data:updated,error:re}=await sb.from('routes').update({status:'closed',end_date:dateNow(),closed_at:new Date().toISOString()}).eq('id',routeId).eq('status','open').select('id').maybeSingle();
  if(re)return alert('Container stock and closing totals are saved, but route status could not be updated: '+re.message);
  if(!updated)return alert('This route is already closed or no longer active.');
  await refresh();render();alert('Route closed. Remaining stock has been saved in Container Stock for the next route.');
 };
};
</script>

</body></html>
